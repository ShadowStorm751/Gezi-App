# Konumu yaklaşık kalan yerleri OSM'de adıyla arar (data-pipeline/osm_lookup.py).
# Geofabrik Türkiye dosyası + osmium; Overpass'a ve canlı veritabanına bağlı değil.
# Tetikleme: data-pipeline/lookup-request.txt değişip main'e ya da data/* dalına yüklenince, ya da elle.
# Sonuç: data-pipeline/results/osm_lookup.json ve osm_lookup-status.txt (her durumda commit'lenir).
name: OSM konum araması

on:
  workflow_dispatch:
  push:
    branches: [main, "data/**"]
    paths: [data-pipeline/lookup-request.txt]

permissions:
  contents: write

concurrency:
  group: osm-lookup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ara
        run: |
          set +e -o pipefail
          {
            sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool &&
            curl -fL --retry 5 --retry-delay 10 -o /tmp/turkey.osm.pbf \
              https://download.geofabrik.de/europe/turkey-latest.osm.pbf &&
            python data-pipeline/osm_lookup.py --pbf /tmp/turkey.osm.pbf
          } > /tmp/log.txt 2>&1
          status=$?
          { if [ $status -eq 0 ]; then echo ok; else echo failed; fi
            echo "zaman: $(date -u +%Y-%m-%dT%H:%M:%SZ)"; tail -n 30 /tmp/log.txt; } > data-pipeline/results/osm_lookup-status.txt
          cat data-pipeline/results/osm_lookup-status.txt
          exit $status
      - name: Sonucu kaydet
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data-pipeline/results/osm_lookup.json data-pipeline/results/osm_lookup-status.txt
          git commit -m "OSM konum araması (sonuç)" || echo "Değişiklik yok"
          git pull --rebase
          git push
