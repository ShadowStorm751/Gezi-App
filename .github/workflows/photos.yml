# Onaylı yerlerin Wikimedia Commons fotoğraf bilgilerini (adres, yazar, lisans) toplar.
# Tetikleme: data-pipeline/photos-request.txt değişip main'e (ya da data/* dalına) yüklenince ya da elle.
# Hangi şehirler: photos-request.txt içindeki "Şehirler:" satırı (yoksa istanbul) ya da elle çalıştırmada "cities".
# Sonuç: data-pipeline/results/photos.json (İstanbul) ya da results/<şehir>/photos.json olarak commit'lenir.
name: Yer fotoğrafları

on:
  workflow_dispatch:
    inputs:
      cities:
        description: "Şehirler (boşlukla ayrılmış)"
        required: false
        default: "istanbul"
  push:
    branches: [main, "data/**"]
    paths: [data-pipeline/photos-request.txt]

permissions:
  contents: write

concurrency:
  group: data-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testler
        run: python -m unittest discover -s data-pipeline/tests
      - name: Fotoğraf bilgilerini topla
        env:
          INPUT_CITIES: ${{ github.event.inputs.cities }}
        run: |
          set -e
          cities="$INPUT_CITIES"
          [ -n "$cities" ] || cities=$(sed -n 's/^Şehirler:[[:space:]]*//p' data-pipeline/photos-request.txt | head -1)
          for city in ${cities:-istanbul}; do
            python data-pipeline/photos.py --city "$city"
          done
      - name: Sonucu kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data-pipeline/results
          git commit -m "Veri hattı: yer fotoğrafları güncellendi" || echo "Değişiklik yok"
          git pull --rebase
          git push
