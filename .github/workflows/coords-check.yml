# Wikidata konumu olmayan yerlerin bağımsız konum kontrolü (coords_check.py). Hiçbir şeyi değiştirmez:
# sonuç results/<şehir>/coords_check.json olarak commit'lenir, şüpheliler elle incelenir.
# Tetikleme: data-pipeline/coords-check-request.txt değişip data/* dalına yüklenince ya da elle.
name: Konum kontrolü

on:
  workflow_dispatch:
    inputs:
      cities:
        description: "Şehirler (boşlukla ayrılmış)"
        required: false
        default: "izmir bursa kapadokya"
  push:
    branches: ["data/**"]
    paths: [data-pipeline/coords-check-request.txt]

permissions:
  contents: write

concurrency:
  group: data-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Konumları kontrol et
        env:
          INPUT_CITIES: ${{ github.event.inputs.cities }}
        run: |
          set -e
          cities="$INPUT_CITIES"
          [ -n "$cities" ] || cities=$(sed -n 's/^Şehirler:[[:space:]]*//p' data-pipeline/coords-check-request.txt | head -1)
          for city in ${cities:-izmir bursa kapadokya}; do
            python data-pipeline/coords_check.py --city "$city"
          done
      - name: Sonucu kaydet
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data-pipeline/results
          git commit -m "Veri hattı: konum kontrolü" || echo "Değişiklik yok"
          git pull --rebase
          git push
