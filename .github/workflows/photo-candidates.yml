# Fotoğrafı olmayan yerler için Commons'tan aday fotoğraflar (küçük önizlemeler) toplar; seçim elle yapılır.
# Tetikleme: data-pipeline/photo-candidates-request.txt değişip main'e yüklenince ya da elle.
# Sonuç: data-pipeline/results/photo-candidates/ olarak commit'lenir.
name: Fotoğraf adayları

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [data-pipeline/photo-candidates-request.txt]

permissions:
  contents: write

concurrency:
  group: data-pipeline-main-photos
  cancel-in-progress: true

jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testler
        run: python -m unittest discover -s data-pipeline/tests
      - name: Aday fotoğrafları topla
        run: python data-pipeline/photo_candidates.py
      - name: Sonucu kaydet
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data-pipeline/results/photo-candidates
          git commit -m "Veri hattı: fotoğraf adayları" || echo "Değişiklik yok"
          git pull --rebase
          git push
