# Uzun açıklamalar için Vikipedi (TR/EN) ve Wikidata kaynak metinlerini toplar (yalnızca bilgi kontrolü).
# Tetikleme: data-pipeline/wiki-extracts-request.txt değişip main'e yüklenince ya da elle.
# Sonuç: data-pipeline/results/wiki-extracts.json.gz olarak commit'lenir.
name: Vikipedi kaynak metinleri

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [data-pipeline/wiki-extracts-request.txt]

permissions:
  contents: write

concurrency:
  group: data-pipeline
  cancel-in-progress: false

jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testler
        run: python -m unittest discover -s data-pipeline/tests
      - name: Kaynak metinleri topla
        run: python data-pipeline/wiki_extracts.py
      - name: Sonucu kaydet
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data-pipeline/results/wiki-extracts.json.gz
          git commit -m "Veri hattı: Vikipedi kaynak metinleri" || echo "Değişiklik yok"
          git pull --rebase
          git push
