# Veri hattını GitHub'ın sunucularında çalıştırır; kimsenin bilgisayarına Python kurması gerekmez.
# Tetikleme: data-pipeline/run-request.txt dosyası değişip main'e (ya da data/* dalına) yüklendiğinde
# ya da GitHub'da Actions -> "Veri hattı" -> "Run workflow" ile.
# Hangi şehirler: run-request.txt içindeki "Şehirler:" satırı (yoksa istanbul) ya da elle çalıştırmada "cities".
# Sonuç: İstanbul data-pipeline/results/, diğer şehirler data-pipeline/results/<şehir>/ klasörüne
# candidates.csv ve areas.json olarak, tetikleyen dala commit'lenir.
name: Veri hattı

on:
  workflow_dispatch:
    inputs:
      cities:
        description: "Şehirler (boşlukla ayrılmış, ör. izmir bursa kapadokya)"
        required: false
        default: "istanbul"
  push:
    branches: [main, "data/**"]
    paths: [data-pipeline/run-request.txt]

permissions:
  contents: write

concurrency:
  group: data-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testler
        run: python -m unittest discover -s data-pipeline/tests

      - name: Şehirleri belirle
        id: cities
        env:
          INPUT_CITIES: ${{ github.event.inputs.cities }}
        run: |
          if [ -n "$INPUT_CITIES" ]; then
            cities="$INPUT_CITIES"
          else
            cities=$(sed -n 's/^Şehirler:[[:space:]]*//p' data-pipeline/run-request.txt | head -1)
          fi
          cities=${cities:-istanbul}
          echo "Şehirler: $cities"
          echo "list=$cities" >> "$GITHUB_OUTPUT"

      - name: OSM ve Wikidata'dan indir, aday listesini üret
        env:
          CITIES: ${{ steps.cities.outputs.list }}
        run: |
          failed=""
          for city in $CITIES; do
            if [ "$city" = "istanbul" ]; then out=data-pipeline/output; res=data-pipeline/results;
            else out=data-pipeline/output/$city; res=data-pipeline/results/$city; fi
            echo "::group::$city"
            if ! python data-pipeline/pipeline.py --city "$city" --out "$out" fetch \
               || ! python data-pipeline/pipeline.py --city "$city" --out "$out" candidates; then
              echo "::error::$city başarısız; diğer şehirlere devam"
              failed="$failed $city"; echo "::endgroup::"; continue
            fi
            mkdir -p "$res/raw"
            cp "$out/candidates.csv" "$out/areas.json" "$res/"
            gzip -c "$out/osm_raw.json" > "$res/raw/osm_raw.json.gz"
            gzip -c "$out/wikidata.json" > "$res/raw/wikidata.json.gz"
            OUT="$out" RES="$res" python - <<'PY'
          import json, os, pathlib
          out, res = pathlib.Path(os.environ["OUT"]), pathlib.Path(os.environ["RES"])
          osm = json.loads((out / "osm_raw.json").read_text(encoding="utf-8"))
          wd = json.loads((out / "wikidata.json").read_text(encoding="utf-8"))
          (res / "run-info.txt").write_text(
              f"osm_elements={len(osm.get('elements', []))}\nwikidata_entities={len(wd)}\n", encoding="utf-8")
          PY
            echo "::endgroup::"
            sleep 30  # Overpass sunucusuna nefes aldır
          done
          echo "failed=$failed" >> "$GITHUB_ENV"

      - name: Sonuçları kaydet
        env:
          CITIES: ${{ steps.cities.outputs.list }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data-pipeline/results
          git commit -m "Veri hattı: aday listesi güncellendi ($CITIES)" || echo "Değişiklik yok"
          git pull --rebase
          git push
          if [ -n "$failed" ]; then echo "::error::Başarısız şehirler:$failed"; exit 1; fi
